<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>MilanoGourmet</title>
<meta name="description" content="La tua mappa personale di locali, con categorie e tag.">
<meta name="theme-color" content="#FBFAF7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MilanoGourmet">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
:root{
  --paper:#FBFAF7;
  --ink:#20242E;
  --ink-2:#5B6472;
  --line:#E5E2DA;
  --bitter:#D8432C;
  --white:#FFFFFF;
  --r:14px;
  --shadow:0 6px 24px rgba(32,36,46,.14), 0 1px 3px rgba(32,36,46,.10);
  --sat:env(safe-area-inset-top, 0px);
  --sab:env(safe-area-inset-bottom, 0px);
  --font-ui:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  --font-display:"Fraunces", Georgia, serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overscroll-behavior:none}
body{font-family:var(--font-ui);color:var(--ink);background:var(--paper)}
#map{position:fixed;inset:0;z-index:1;background:#E9E6DE}
.leaflet-control-attribution{font-size:9px;opacity:.75}
button{font-family:var(--font-ui)}

/* ---- pin tondo (signature) ---- */
.pin{
  width:34px;height:34px;border-radius:50%;
  background:var(--white);
  border:3px solid var(--c,#5B6472);
  box-shadow:0 2px 8px rgba(32,36,46,.35);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;line-height:1;
  position:relative;
}
.pin::after{
  content:"";position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);
  width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;
  border-top:8px solid var(--c,#5B6472);
}
.pin.tmp{border-style:dashed;animation:pulse 1.2s ease-in-out infinite}
.pin .star{
  position:absolute;top:-8px;right:-8px;width:17px;height:17px;border-radius:50%;
  background:#E0A21C;color:#fff;font-size:10px;line-height:1;
  display:flex;align-items:center;justify-content:center;border:1.5px solid #fff;
}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@media (prefers-reduced-motion: reduce){ .pin.tmp{animation:none} }

/* ---- suggerimenti tag ---- */
.tagsugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag.sugg{border:1px dashed #CFCBBF;background:var(--white);cursor:pointer;font-family:var(--font-ui)}
.tag.sugg:active{background:#F3F1EA}

/* ---- barra di ricerca ---- */
.topbar{
  position:fixed;z-index:1000;
  top:calc(var(--sat) + 10px);left:12px;right:12px;
}
.searchbox{
  display:flex;align-items:center;gap:8px;
  background:var(--white);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:0 12px;height:48px;
}
.searchbox .brand{
  font-family:var(--font-display);font-weight:700;font-size:19px;color:var(--bitter);
  letter-spacing:.2px;user-select:none;padding-right:8px;border-right:1px solid var(--line);
}
.searchbox input{
  flex:1;border:0;outline:0;font-size:16px;background:transparent;color:var(--ink);min-width:0;
}
.searchbox input::placeholder{color:var(--ink-2)}
.searchbox .clear{border:0;background:transparent;color:var(--ink-2);font-size:18px;padding:6px;display:none}
.results{
  margin-top:8px;background:var(--white);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden;display:none;max-height:46vh;overflow-y:auto;
}
.results .res{
  display:block;width:100%;text-align:left;border:0;background:transparent;
  padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;
}
.results .res:last-child{border-bottom:0}
.results .res:active{background:#F3F1EA}
.res .rn{font-size:15px;font-weight:600}
.res .ra{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.res.hint{color:var(--ink-2);font-size:13px;cursor:default}

/* ---- bottoni flottanti ---- */
.fabs{position:fixed;z-index:900;right:12px;bottom:calc(var(--sab) + 76px);display:flex;flex-direction:column;gap:10px}
.fab{
  width:46px;height:46px;border-radius:50%;border:1px solid var(--line);
  background:var(--white);box-shadow:var(--shadow);font-size:19px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);
}
.fab:active{transform:scale(.94)}

/* ---- chips categorie ---- */
.bottombar{
  position:fixed;z-index:900;left:0;right:0;bottom:0;
  padding:10px 10px calc(var(--sab) + 10px);
  display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  background:linear-gradient(to top, rgba(251,250,247,.96), rgba(251,250,247,0));
}
.bottombar::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;display:flex;align-items:center;gap:6px;
  height:38px;padding:0 13px;border-radius:999px;
  background:var(--white);border:1.5px solid var(--line);
  box-shadow:0 2px 8px rgba(32,36,46,.10);
  font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;white-space:nowrap;
}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--c,var(--ink-2))}
.chip.on{border-color:var(--c,var(--ink));background:var(--c,var(--ink));color:var(--white)}
.chip.on .dot{background:var(--white)}
.chip .n{font-weight:500;opacity:.7;font-size:12.5px}
.chip.tagchip.on{background:var(--ink);border-color:var(--ink)}

/* ---- sheet ---- */
.backdrop{position:fixed;inset:0;z-index:1100;background:rgba(32,36,46,.34);display:none}
.sheet{
  position:fixed;z-index:1200;left:0;right:0;bottom:0;
  background:var(--paper);border-radius:18px 18px 0 0;
  box-shadow:0 -8px 32px rgba(32,36,46,.22);
  max-height:82vh;display:none;flex-direction:column;
  padding-bottom:calc(var(--sab) + 8px);
}
.sheet.open,.backdrop.open{display:flex}
.backdrop.open{display:block}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:9px auto 2px}
.sheet header{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 18px 10px;border-bottom:1px solid var(--line);
}
.sheet header h2{
  margin:0;font-family:var(--font-display);font-weight:700;font-size:21px;letter-spacing:.1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.sheet header .x{border:0;background:#EFEDE6;color:var(--ink);width:30px;height:30px;border-radius:50%;font-size:15px;cursor:pointer;flex:0 0 auto;margin-left:10px}
.sheet .body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 18px}

/* ---- form ---- */
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin-bottom:6px}
.field input[type=text],.field textarea{
  width:100%;border:1px solid var(--line);border-radius:10px;background:var(--white);
  padding:11px 12px;font-size:16px;color:var(--ink);outline:none;font-family:var(--font-ui);
}
.field input:focus,.field textarea:focus{border-color:var(--bitter)}
.field textarea{resize:vertical;min-height:64px}
.catpick{display:flex;flex-wrap:wrap;gap:8px}
.catpick .chip{box-shadow:none}
.addr{font-size:13px;color:var(--ink-2);line-height:1.45}
.btnrow{display:flex;gap:10px;margin-top:6px}
.btn{
  flex:1;border:0;border-radius:12px;height:46px;font-size:15.5px;font-weight:600;cursor:pointer;
}
.btn.primary{background:var(--bitter);color:var(--white)}
.btn.primary:active{filter:brightness(.92)}
.btn.ghost{background:var(--white);border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--white);border:1.5px solid #E3B8B1;color:#A8341F}

/* ---- dettaglio ---- */
.badge{display:inline-flex;align-items:center;gap:7px;background:var(--white);border:1.5px solid var(--c,var(--line));color:var(--ink);border-radius:999px;padding:5px 12px;font-size:13.5px;font-weight:600}
.badge .dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--ink-2))}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{background:#EFEDE6;color:var(--ink);border-radius:999px;padding:4px 11px;font-size:13px;font-weight:500}
.detail .addr{margin-top:12px}
.detail .notes{margin-top:12px;font-size:14.5px;line-height:1.55;white-space:pre-wrap}
.detail .meta{margin-top:14px;font-size:11.5px;color:var(--ink-2)}

/* ---- lista ---- */
.listsearch{margin-bottom:10px}
.listsearch input{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--white);padding:10px 12px;font-size:16px;outline:none}
.placerow{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--white);border:1px solid var(--line);border-radius:12px;
  padding:11px 13px;margin-bottom:8px;cursor:pointer;
}
.placerow:active{background:#F3F1EA}
.placerow .pdot{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:2.5px solid var(--c,var(--ink-2));display:flex;align-items:center;justify-content:center;font-size:14px;background:var(--white)}
.placerow .pt{min-width:0;flex:1}
.placerow .pn{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.placerow .pa{font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.placerow .ptags{font-size:11.5px;color:var(--bitter);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:var(--ink-2);font-size:14px;text-align:center;padding:26px 10px;line-height:1.5}

/* ---- impostazioni ---- */
.setsec{margin-bottom:22px}
.setsec h3{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin:0 0 10px}
.catrow{display:flex;align-items:center;gap:10px;background:var(--white);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:7px}
.catrow .dot{width:14px;height:14px;border-radius:50%;background:var(--c)}
.catrow .cn{flex:1;font-size:14.5px;font-weight:600}
.catrow .cc{font-size:12px;color:var(--ink-2)}
.catrow .del{border:0;background:transparent;color:#A8341F;font-size:16px;cursor:pointer;padding:4px}
.newcat{display:flex;gap:8px;align-items:center}
.newcat input[type=text]{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;background:var(--white);outline:none;min-width:0}
.newcat .emoji{width:56px;flex:0 0 auto;text-align:center}
.newcat input[type=color]{width:42px;height:42px;border:1px solid var(--line);border-radius:10px;background:var(--white);padding:3px;flex:0 0 auto}
.newcat .add{flex:0 0 auto;width:42px;height:42px;border-radius:10px;border:0;background:var(--bitter);color:var(--white);font-size:20px;cursor:pointer}
.stat{font-size:13.5px;color:var(--ink-2);line-height:1.6}

/* ---- toast ---- */
.toast{
  position:fixed;z-index:2000;left:50%;transform:translateX(-50%);
  bottom:calc(var(--sab) + 86px);
  background:var(--ink);color:var(--white);font-size:14px;font-weight:500;
  padding:10px 18px;border-radius:999px;box-shadow:var(--shadow);
  opacity:0;pointer-events:none;transition:opacity .25s;
  max-width:86vw;text-align:center;
}
.toast.show{opacity:1}
input[type=file]{display:none}
:focus-visible{outline:2px solid var(--bitter);outline-offset:2px}
</style>
</head>
<body>

<div id="map" aria-label="Mappa dei locali"></div>

<div class="topbar">
  <div class="searchbox">
    <span class="brand">Milano</span>
    <input id="q" type="text" placeholder="Cerca un locale o un indirizzo…" autocomplete="off" enterkeyhint="search">
    <button class="clear" id="qclear" aria-label="Pulisci ricerca">✕</button>
  </div>
  <div class="results" id="results"></div>
</div>

<div class="fabs">
  <button class="fab" id="btn-locate" aria-label="Vai alla mia posizione" title="La mia posizione">➤</button>
  <button class="fab" id="btn-list" aria-label="Elenco dei posti salvati" title="Elenco">☰</button>
  <button class="fab" id="btn-settings" aria-label="Impostazioni" title="Impostazioni">⚙︎</button>
</div>

<nav class="bottombar" id="chips" aria-label="Filtri"></nav>

<div class="backdrop" id="backdrop"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <header>
    <h2 id="sheet-title"></h2>
    <button class="x" id="sheet-close" aria-label="Chiudi">✕</button>
  </header>
  <div class="body" id="sheet-body"></div>
</section>

<div class="toast" id="toast" role="status"></div>
<input type="file" id="importfile" accept="application/json,.json">
<input type="file" id="takeoutfile" accept=".json,.geojson,.csv,application/json,text/csv,application/geo+json">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
"use strict";

/* ============ stato e persistenza ============ */
const LS_KEY = "posti.data.v1";
const DEFAULT_CATS = [
  {id:"rist",  name:"Ristorante",  emoji:"🍝", color:"#D8432C"},
  {id:"pizza", name:"Pizzeria",    emoji:"🍕", color:"#E08914"},
  {id:"caffe", name:"Caffè",       emoji:"☕", color:"#7A4A2B"},
  {id:"cockt", name:"Cocktail bar",emoji:"🍸", color:"#8246AF"},
  {id:"enot",  name:"Enoteca",     emoji:"🍷", color:"#7D2231"},
  {id:"gelat", name:"Gelateria",   emoji:"🍨", color:"#2E8BC0"},
  {id:"past",  name:"Pasticceria", emoji:"🍰", color:"#D6699A"},
  {id:"altro", name:"Altro",       emoji:"📍", color:"#5B6472"}
];

const STATUSES = [
  {id:"try",     name:"Da provare", icon:"⏳", color:"#B07A2A"},
  {id:"visited", name:"Visitato",   icon:"✓",  color:"#3E7C4F"},
  {id:"fav",     name:"Preferito",  icon:"★",  color:"#E0A21C"}
];
const stById = id => STATUSES.find(s=>s.id===id) || STATUSES[0];

let state = load();
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const d = JSON.parse(raw);
      if(Array.isArray(d.places) && Array.isArray(d.categories)){
        d.places.forEach(p=>{ if(!p.status) p.status = "try"; }); // migrazione v1 → v2
        return d;
      }
    }
  }catch(e){ console.warn("load:", e); }
  return { places:[], categories: DEFAULT_CATS.map(c=>({...c})), settings:{} };
}
function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }
  catch(e){ toast("Errore di salvataggio: spazio esaurito?"); }
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const catById = id => state.categories.find(c=>c.id===id) || {id:"?",name:"Senza categoria",emoji:"📍",color:"#5B6472"};

/* filtri attivi */
const filters = { cats:new Set(), tags:new Set(), status:new Set() };

/* ============ utilità ============ */
function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, m => (
    {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]
  ));
}
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._h);
  toast._h = setTimeout(()=>t.classList.remove("show"), 2300);
}
function debounce(fn, ms){
  let h; return (...a)=>{ clearTimeout(h); h=setTimeout(()=>fn(...a), ms); };
}
function allTags(){
  const s = new Set();
  state.places.forEach(p => (p.tags||[]).forEach(t => s.add(t)));
  return [...s].sort((a,b)=>a.localeCompare(b,"it"));
}
function parseTags(str){
  return [...new Set(String(str||"").split(",").map(t=>t.trim().replace(/^#/,"")).filter(Boolean))];
}

/* ============ mappa ============ */
const map = L.map("map", { zoomControl:false, attributionControl:true })
  .setView([45.4642, 9.1900], 13); // Milano
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);

const markersLayer = L.layerGroup().addTo(map);
let tmpMarker = null;

function pinIcon(cat, tmp=false, status=null){
  const star = status==="fav" ? '<span class="star">★</span>' : "";
  return L.divIcon({
    className: "",
    html: `<div class="pin${tmp?" tmp":""}" style="--c:${esc(cat.color)}">${esc(cat.emoji)}${star}</div>`,
    iconSize: [34,43],
    iconAnchor: [17,43]
  });
}
function clearTmp(){ if(tmpMarker){ map.removeLayer(tmpMarker); tmpMarker = null; } }

function visiblePlaces(){
  return state.places.filter(p=>{
    if(filters.cats.size && !filters.cats.has(p.cat)) return false;
    if(filters.status.size && !filters.status.has(p.status || "try")) return false;
    if(filters.tags.size && ![...filters.tags].every(t => (p.tags||[]).includes(t))) return false;
    return true;
  });
}
function renderMarkers(){
  markersLayer.clearLayers();
  visiblePlaces().forEach(p=>{
    const c = catById(p.cat);
    L.marker([p.lat, p.lon], { icon: pinIcon(c, false, p.status), title: p.name })
      .on("click", ()=> openDetail(p.id))
      .addTo(markersLayer);
  });
}

/* pressione prolungata sulla mappa → aggiungi posto */
(function longPress(){
  const el = map.getContainer();
  let timer = null, start = null;
  const cancel = ()=>{ clearTimeout(timer); timer = null; };
  el.addEventListener("touchstart", e=>{
    if(e.touches.length !== 1) return cancel();
    start = { x:e.touches[0].clientX, y:e.touches[0].clientY };
    timer = setTimeout(()=>{
      const pt = map.mouseEventToLatLng(e.touches[0]);
      onMapLongPress(pt);
    }, 550);
  }, {passive:true});
  el.addEventListener("touchmove", e=>{
    if(!timer || !start) return;
    const dx = e.touches[0].clientX - start.x, dy = e.touches[0].clientY - start.y;
    if(Math.hypot(dx,dy) > 12) cancel();
  }, {passive:true});
  el.addEventListener("touchend", cancel);
  el.addEventListener("touchcancel", cancel);
  map.on("contextmenu", e => onMapLongPress(e.latlng)); // desktop: tasto destro
})();

async function onMapLongPress(latlng){
  if(navigator.vibrate) navigator.vibrate(12);
  clearTmp();
  tmpMarker = L.marker(latlng, { icon: pinIcon({emoji:"➕", color:"#D8432C"}, true) }).addTo(map);
  map.panTo(latlng);
  const addr = await reverseGeocode(latlng.lat, latlng.lng);
  openForm({ lat: latlng.lat, lon: latlng.lng, address: addr, name: "" });
}

/* ============ geocoding ============ */
async function searchPlaces(q){
  const c = map.getCenter();
  // Photon (komoot): veloce, adatto all'autocomplete
  try{
    const u = `https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=6&lat=${c.lat.toFixed(4)}&lon=${c.lng.toFixed(4)}`;
    const r = await fetch(u);
    if(r.ok){
      const d = await r.json();
      const out = (d.features||[]).map(f=>{
        const p = f.properties || {};
        const parts = [p.street && (p.street + (p.housenumber? " "+p.housenumber : "")), p.postcode, p.city || p.county, p.country]
          .filter(Boolean);
        return {
          name: p.name || parts[0] || "Senza nome",
          address: parts.join(", "),
          lat: f.geometry.coordinates[1],
          lon: f.geometry.coordinates[0]
        };
      });
      if(out.length) return out;
    }
  }catch(e){ console.warn("photon:", e); }
  // Fallback: Nominatim
  try{
    const u = `https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&accept-language=it&q=${encodeURIComponent(q)}`;
    const r = await fetch(u);
    if(r.ok){
      const d = await r.json();
      return d.map(x=>({
        name: x.name || (x.display_name||"").split(",")[0],
        address: x.display_name || "",
        lat: parseFloat(x.lat), lon: parseFloat(x.lon)
      }));
    }
  }catch(e){ console.warn("nominatim:", e); }
  return [];
}
async function reverseGeocode(lat, lon){
  try{
    const u = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&accept-language=it&lat=${lat}&lon=${lon}`;
    const r = await fetch(u);
    if(r.ok){ const d = await r.json(); return d.display_name || ""; }
  }catch(e){ console.warn("reverse:", e); }
  return "";
}

/* ============ import Google Takeout ============ */
function parseCSV(text){
  const rows = []; let row = [], field = "", inQ = false;
  for(let i=0; i<text.length; i++){
    const ch = text[i];
    if(inQ){
      if(ch === '"'){ if(text[i+1] === '"'){ field += '"'; i++; } else inQ = false; }
      else field += ch;
    }else{
      if(ch === '"') inQ = true;
      else if(ch === ','){ row.push(field); field = ""; }
      else if(ch === '\n'){ row.push(field); rows.push(row); row = []; field = ""; }
      else if(ch !== '\r') field += ch;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.length > 1 || (r[0] && r[0].trim()));
}
function coordsFromUrl(u){
  if(!u) return null;
  let m = u.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
  if(m) return {lat:+m[1], lon:+m[2]};
  m = u.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/);
  if(m) return {lat:+m[1], lon:+m[2]};
  m = u.match(/[?&](?:q|ll)=(-?\d+\.\d+),(-?\d+\.\d+)/);
  if(m) return {lat:+m[1], lon:+m[2]};
  return null;
}
function validCoords(lat, lon){
  return Number.isFinite(lat) && Number.isFinite(lon) &&
    Math.abs(lat) <= 90 && Math.abs(lon) <= 180 && !(lat === 0 && lon === 0);
}
function parseTakeout(text){
  const items = [], pending = [];
  let gj = null;
  try{ gj = JSON.parse(text); }catch(e){}
  if(gj && gj.type === "FeatureCollection" && Array.isArray(gj.features)){
    gj.features.forEach(f=>{
      const pr = f.properties || {};
      const loc = pr.Location || {};
      const name = (pr.Title || loc["Business Name"] || pr.name || "").trim();
      if(!name) return;
      const notes = (pr.Note || pr.Comment || "").trim();
      let lat = null, lon = null;
      if(f.geometry && Array.isArray(f.geometry.coordinates)){
        lon = +f.geometry.coordinates[0]; lat = +f.geometry.coordinates[1];
      }
      if(!validCoords(lat, lon) && loc["Geo Coordinates"]){
        lat = +loc["Geo Coordinates"].Latitude; lon = +loc["Geo Coordinates"].Longitude;
      }
      if(validCoords(lat, lon)) items.push({name, address: loc.Address || "", lat, lon, notes});
      else pending.push({name, notes});
    });
    return {items, pending};
  }
  const rows = parseCSV(text);
  if(rows.length < 2) return {items, pending};
  const head = rows[0].map(h => h.trim().toLowerCase());
  const iT = head.indexOf("title"), iU = head.indexOf("url"),
        iN = head.indexOf("note"), iC = head.indexOf("comment");
  if(iT === -1) return {items, pending};
  rows.slice(1).forEach(r=>{
    const name = (r[iT] || "").trim();
    if(!name) return;
    const notes = [iN>-1 ? r[iN] : "", iC>-1 ? r[iC] : ""].map(x=>(x||"").trim()).filter(Boolean).join(" — ");
    const c = coordsFromUrl(iU>-1 ? r[iU] : "");
    if(c && validCoords(c.lat, c.lon)) items.push({name, address:"", lat:c.lat, lon:c.lon, notes});
    else pending.push({name, notes});
  });
  return {items, pending};
}
function distM(lat1, lon1, lat2, lon2){
  const R = 6371000, toR = Math.PI/180;
  const x = (lon2-lon1)*toR*Math.cos((lat1+lat2)/2*toR);
  const y = (lat2-lat1)*toR;
  return Math.sqrt(x*x + y*y) * R;
}
function isDup(name, lat, lon){
  const n = name.trim().toLowerCase();
  return state.places.some(p => p.name.trim().toLowerCase() === n && distM(p.lat, p.lon, lat, lon) < 150);
}
async function geocodeOne(name){
  try{
    const c = map.getCenter();
    const u = `https://photon.komoot.io/api/?q=${encodeURIComponent(name)}&limit=1&lat=${c.lat.toFixed(3)}&lon=${c.lng.toFixed(3)}`;
    const r = await fetch(u);
    if(r.ok){
      const d = await r.json();
      const f = (d.features || [])[0];
      if(f && f.geometry){
        const p = f.properties || {};
        const parts = [p.street && (p.street + (p.housenumber? " "+p.housenumber : "")), p.postcode, p.city || p.county].filter(Boolean);
        return { lat: f.geometry.coordinates[1], lon: f.geometry.coordinates[0], address: parts.join(", ") };
      }
    }
  }catch(e){ console.warn("geocodeOne:", e); }
  return null;
}
function openTakeoutPreview(parsed){
  const {items, pending} = parsed;
  const MAXG = 100;
  const toGeo = pending.slice(0, MAXG);
  let selCat = (state.categories.find(c=>c.id==="altro") || state.categories[0]).id;
  let selSt = "try";
  const body = openSheet("Importa da Takeout");
  body.innerHTML = `
    <p class="stat" style="margin-bottom:14px">
      Riconosciuti <b>${items.length}</b> posti con coordinate${pending.length ? ` e <b>${pending.length}</b> senza coordinate, che verranno cercati per nome${pending.length>MAXG ? ` (primi ${MAXG})` : ""}` : ""}.
    </p>
    <div class="field"><label>Categoria assegnata</label><div class="catpick" id="tk-cats"></div></div>
    <div class="field"><label>Stato assegnato</label><div class="catpick" id="tk-st"></div></div>
    <div class="btnrow">
      <button class="btn ghost" id="tk-cancel">Annulla</button>
      <button class="btn primary" id="tk-go">Avvia importazione</button>
    </div>
    <p class="stat" id="tk-prog" style="margin-top:12px"></p>
  `;
  const catsEl = body.querySelector("#tk-cats");
  function paintC(){
    catsEl.innerHTML = "";
    state.categories.forEach(c=>{
      const b = document.createElement("button");
      b.type = "button";
      b.className = "chip" + (selCat===c.id ? " on" : "");
      b.style.setProperty("--c", c.color);
      b.innerHTML = `${esc(c.emoji)} ${esc(c.name)}`;
      b.addEventListener("click", ()=>{ selCat = c.id; paintC(); });
      catsEl.appendChild(b);
    });
  }
  paintC();
  const stEl = body.querySelector("#tk-st");
  function paintS(){
    stEl.innerHTML = "";
    STATUSES.forEach(s=>{
      const b = document.createElement("button");
      b.type = "button";
      b.className = "chip" + (selSt===s.id ? " on" : "");
      b.style.setProperty("--c", s.color);
      b.innerHTML = `${s.icon} ${esc(s.name)}`;
      b.addEventListener("click", ()=>{ selSt = s.id; paintS(); });
      stEl.appendChild(b);
    });
  }
  paintS();
  body.querySelector("#tk-cancel").addEventListener("click", closeSheet);
  body.querySelector("#tk-go").addEventListener("click", async ()=>{
    const go = body.querySelector("#tk-go");
    const prog = body.querySelector("#tk-prog");
    go.disabled = true;
    let added = 0, dup = 0, fail = 0;
    const push = (it)=>{
      state.places.push({
        id: uid(), name: it.name, cat: selCat, status: selSt,
        tags: [], notes: it.notes || "", address: it.address || "",
        lat: it.lat, lon: it.lon, created: Date.now()
      });
      added++;
    };
    items.forEach(it=>{ isDup(it.name, it.lat, it.lon) ? dup++ : push(it); });
    save(); renderMarkers(); renderChips();
    for(let i=0; i<toGeo.length; i++){
      prog.textContent = `Ricerca coordinate ${i+1}/${toGeo.length}: ${toGeo[i].name}`;
      const g = await geocodeOne(toGeo[i].name);
      if(g){
        if(isDup(toGeo[i].name, g.lat, g.lon)) dup++;
        else push({...toGeo[i], ...g});
      }else fail++;
      await new Promise(r=>setTimeout(r, 300));
    }
    save(); refresh();
    const skipped = pending.length - toGeo.length;
    prog.textContent = `Importazione completata: ${added} aggiunti, ${dup} duplicati ignorati, ${fail} non trovati${skipped ? `, ${skipped} oltre il limite di ${MAXG}` : ""}.`;
    if(added && state.places.length){
      const b = L.latLngBounds(state.places.map(p=>[p.lat, p.lon]));
      map.fitBounds(b.pad(0.2), { maxZoom: 15 });
    }
    toast(`${added} posti importati`);
    go.style.display = "none";
    body.querySelector("#tk-cancel").textContent = "Chiudi";
  });
}
document.getElementById("takeoutfile").addEventListener("change", e=>{
  const f = e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    const parsed = parseTakeout(String(r.result || ""));
    if(!parsed.items.length && !parsed.pending.length){
      toast("Nessun posto riconosciuto nel file");
      return;
    }
    openTakeoutPreview(parsed);
  };
  r.readAsText(f);
  e.target.value = "";
});

/* ============ posizione ============ */
let meMarker = null;
document.getElementById("btn-locate").addEventListener("click", ()=>{
  map.locate({ setView:true, maxZoom:16, enableHighAccuracy:true });
});
map.on("locationfound", e=>{
  if(meMarker) map.removeLayer(meMarker);
  meMarker = L.circleMarker(e.latlng, { radius:8, color:"#FFFFFF", weight:3, fillColor:"#2E6FE8", fillOpacity:1 }).addTo(map);
});
map.on("locationerror", ()=> toast("Posizione non disponibile: controlla i permessi"));

/* ============ pulsanti ============ */
document.getElementById("btn-list").addEventListener("click", openList);
document.getElementById("btn-settings").addEventListener("click", openSettings);

/* ============ avvio ============ */
renderChips();
renderMarkers();
if(state.places.length){
  const b = L.latLngBounds(state.places.map(p=>[p.lat,p.lon]));
  map.fitBounds(b.pad(0.2), { maxZoom: 15 });
}

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=> navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
