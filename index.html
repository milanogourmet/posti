<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>MilanoGourmet</title>
<meta name="description" content="La tua mappa personale di locali, con categorie e tag.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://tile.openstreetmap.org; connect-src 'self' https://photon.komoot.io https://nominatim.openstreetmap.org https://places.googleapis.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="theme-color" content="#FBFAF7">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png?v=3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MilanoGourmet">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" integrity="sha384-pmjIAcz2bAn0xukfxADbZIb3t8oRT9Sv0rvO+BR5Csr6Dhqq+nZs59P0pPKQJkEV" crossorigin="anonymous">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" integrity="sha384-wgw+aLYNQ7dlhK47ZPK7FRACiq7ROZwgFNg0m04avm4CaXS+Z9Y7nMu8yNjBKYC+" crossorigin="anonymous">
<style>
:root{
  --paper:#FBFAF7;
  --ink:#20242E;
  --ink-2:#5B6472;
  --line:#E5E2DA;
  --bitter:#D8432C;
  --neutral:#20242E;
  --white:#FFFFFF;
  --r:14px;
  --shadow:0 6px 24px rgba(32,36,46,.14), 0 1px 3px rgba(32,36,46,.10);
  --sat:env(safe-area-inset-top, 0px);
  --sab:env(safe-area-inset-bottom, 0px);
  --font-ui:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  --font-display:"Fraunces", Georgia, serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overscroll-behavior:none}
body{font-family:var(--font-ui);color:var(--ink);background:var(--paper)}
#map{position:fixed;inset:0;z-index:1;background:#E9E6DE;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.leaflet-control-attribution{font-size:9px;opacity:.75}
button{font-family:var(--font-ui)}

/* ---- cluster marker ---- */
.cluster{
  width:42px;height:42px;border-radius:50%;
  background:var(--white);border:3px solid var(--bitter);
  box-shadow:0 2px 10px rgba(0,0,0,.30);
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;color:var(--ink);
}
.cluster.big{border-color:#9C2F1D}

/* ---- pin tondo (signature) ---- */
.pin{
  width:34px;height:34px;border-radius:50%;
  background:var(--white);
  border:3px solid var(--c,#5B6472);
  box-shadow:0 2px 8px rgba(32,36,46,.35);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;line-height:1;
  position:relative;
}
.pin::after{
  content:"";position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);
  width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;
  border-top:8px solid var(--c,#5B6472);
}
.pin.tmp{border-style:dashed;animation:pulse 1.2s ease-in-out infinite}
.pin .star{
  position:absolute;top:-8px;right:-8px;width:17px;height:17px;border-radius:50%;
  background:#E0A21C;color:#fff;font-size:10px;line-height:1;
  display:flex;align-items:center;justify-content:center;border:1.5px solid #fff;
}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@media (prefers-reduced-motion: reduce){ .pin.tmp{animation:none} }

/* ---- suggerimenti tag ---- */
.tagsugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag.sugg{border:1px dashed #CFCBBF;background:var(--white);cursor:pointer;font-family:var(--font-ui)}
.tag.sugg:active{background:#F3F1EA}

/* ---- barra di ricerca ---- */
.topbar{
  position:fixed;z-index:1000;
  top:calc(var(--sat) + 10px);left:12px;right:12px;
}
.searchbox{
  display:flex;align-items:center;gap:8px;
  background:var(--white);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:0 12px;height:48px;
}
.searchbox .brand{
  font-family:var(--font-display);font-weight:700;font-size:19px;color:var(--bitter);
  letter-spacing:.2px;user-select:none;padding-right:8px;border-right:1px solid var(--line);
}
.searchbox input{
  flex:1;border:0;outline:0;font-size:16px;background:transparent;color:var(--ink);min-width:0;
}
.searchbox input::placeholder{color:var(--ink-2)}
.searchbox .clear{border:0;background:transparent;color:var(--ink-2);font-size:18px;padding:6px;display:none}
.results{
  margin-top:8px;background:var(--white);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden;display:none;max-height:46vh;overflow-y:auto;
}
.results .res{
  display:block;width:100%;text-align:left;border:0;background:transparent;
  padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;
}
.results .res:last-child{border-bottom:0}
.results .res:active{background:#F3F1EA}
.res .rn{font-size:15px;font-weight:600}
.res .ra{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.res.hint{color:var(--ink-2);font-size:13px;cursor:default}

/* ---- bottoni flottanti ---- */
.fabs{position:fixed;z-index:900;right:12px;bottom:calc(var(--sab) + 76px);display:flex;flex-direction:column;gap:10px}
.fab{
  width:46px;height:46px;border-radius:50%;border:1px solid var(--line);
  background:var(--white);box-shadow:var(--shadow);font-size:19px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);
}
.fab:active{transform:scale(.94)}
.fab.busy{color:var(--ink-2);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){ .fab.busy{animation:none;opacity:.6} }

/* ---- chips categorie ---- */
.bottombar{
  position:fixed;z-index:900;left:0;right:0;bottom:0;
  padding:10px 10px calc(var(--sab) + 10px);
  display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  background:linear-gradient(to top, rgba(251,250,247,.96), rgba(251,250,247,0));
}
.bottombar::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;display:flex;align-items:center;gap:6px;
  height:38px;padding:0 13px;border-radius:999px;
  background:var(--white);border:1.5px solid var(--line);
  box-shadow:0 2px 8px rgba(32,36,46,.10);
  font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;white-space:nowrap;
}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--c,var(--ink-2))}
.chip.on{border-color:var(--c,var(--ink));background:var(--c,var(--ink));color:#FFFFFF}
.chip.on .dot{background:#FFFFFF}
.chip .n{font-weight:500;opacity:.7;font-size:12.5px}
.chip.tagchip.on{background:var(--ink);border-color:var(--ink)}

/* ---- sheet ---- */
.backdrop{position:fixed;inset:0;z-index:1100;background:rgba(32,36,46,.34);display:none}
.sheet{
  position:fixed;z-index:1200;left:0;right:0;bottom:0;
  background:var(--paper);border-radius:18px 18px 0 0;
  box-shadow:0 -8px 32px rgba(32,36,46,.22);
  max-height:82vh;display:none;flex-direction:column;
  padding-bottom:calc(var(--sab) + 8px);
}
.sheet.open,.backdrop.open{display:flex}
.backdrop.open{display:block}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:9px auto 2px}
.sheet header{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 18px 10px;border-bottom:1px solid var(--line);
}
.sheet header h2{
  margin:0;font-family:var(--font-display);font-weight:700;font-size:21px;letter-spacing:.1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.sheet header .x{border:0;background:#EFEDE6;color:var(--ink);width:30px;height:30px;border-radius:50%;font-size:15px;cursor:pointer;flex:0 0 auto;margin-left:10px}
.sheet .body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 18px}

/* ---- form ---- */
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin-bottom:6px}
.field input[type=text],.field textarea{
  width:100%;border:1px solid var(--line);border-radius:10px;background:var(--white);
  padding:11px 12px;font-size:16px;color:var(--ink);outline:none;font-family:var(--font-ui);
}
.field input:focus,.field textarea:focus{border-color:var(--bitter)}
.field textarea{resize:vertical;min-height:64px}
.catpick{display:flex;flex-wrap:wrap;gap:8px}
.catpick .chip{box-shadow:none}
.addr{font-size:13px;color:var(--ink-2);line-height:1.45}
.btnrow{display:flex;gap:10px;margin-top:6px}
.btn{
  flex:1;border:0;border-radius:12px;height:46px;font-size:15.5px;font-weight:600;cursor:pointer;
}
.btn.primary{background:var(--bitter);color:var(--white)}
.btn.primary:active{filter:brightness(.92)}
.btn.big{width:100%;padding:15px;font-size:16px;justify-content:center}
.bkbox{background:var(--paper-2,#F3EFE7);border:1px solid rgba(0,0,0,.07);border-radius:14px;padding:16px}
.bktitle{font-weight:700;margin:0 0 6px;color:var(--ink)}
.btn.ghost{background:var(--white);border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--white);border:1.5px solid #E3B8B1;color:#A8341F}

/* ---- dettaglio ---- */
.badge{display:inline-flex;align-items:center;gap:7px;background:var(--white);border:1.5px solid var(--c,var(--line));color:var(--ink);border-radius:999px;padding:5px 12px;font-size:13.5px;font-weight:600}
.badge .dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--ink-2))}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{background:#EFEDE6;color:var(--ink);border-radius:999px;padding:4px 11px;font-size:13px;font-weight:500}
.detail .addr{margin-top:12px}
.detail .notes{margin-top:12px;font-size:14.5px;line-height:1.55;white-space:pre-wrap}
.detail .meta{margin-top:14px;font-size:11.5px;color:var(--ink-2)}

/* ---- lista ---- */
.listsearch{margin-bottom:10px}
.listsearch input{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--white);padding:10px 12px;font-size:16px;outline:none}
.sortrow{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.sortrow .lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.sortrow .chip{height:32px;padding:0 11px;font-size:13px}
.loadmore{
  display:block;width:100%;border:1.5px dashed var(--line);background:transparent;
  color:var(--ink-2);border-radius:12px;padding:12px;font-size:14px;font-weight:600;
  cursor:pointer;margin-top:4px;
}
.loadmore:active{background:var(--white)}
.pdist{color:var(--ink-2);font-weight:600}
.catrow .edit{border:0;background:transparent;font-size:15px;cursor:pointer;padding:4px;color:var(--ink-2)}
.placerow{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--white);border:1px solid var(--line);border-radius:12px;
  padding:11px 13px;margin-bottom:8px;cursor:pointer;
}
.placerow:active{background:#F3F1EA}
.placerow .pdot{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:2.5px solid var(--c,var(--ink-2));display:flex;align-items:center;justify-content:center;font-size:14px;background:var(--white)}
.placerow .pt{min-width:0;flex:1}
.placerow .pn{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.placerow .pa{font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.placerow .ptags{font-size:11.5px;color:var(--bitter);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:var(--ink-2);font-size:14px;text-align:center;padding:26px 10px;line-height:1.5}

/* ---- impostazioni ---- */
.setsec{margin-bottom:22px}
.setsec h3{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin:0 0 10px}
.catrow{display:flex;align-items:center;gap:10px;background:var(--white);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:7px}
.catrow .dot{width:14px;height:14px;border-radius:50%;background:var(--c)}
.catrow .cn{flex:1;font-size:14.5px;font-weight:600}
.catrow .cc{font-size:12px;color:var(--ink-2)}
.catrow .del{border:0;background:transparent;color:#A8341F;font-size:16px;cursor:pointer;padding:4px}
.newcat{display:flex;gap:8px;align-items:center}
.newcat input[type=text]{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;background:var(--white);outline:none;min-width:0}
.newcat .emoji{width:56px;flex:0 0 auto;text-align:center}
.newcat input[type=color]{width:42px;height:42px;border:1px solid var(--line);border-radius:10px;background:var(--white);padding:3px;flex:0 0 auto}
.newcat .add{flex:0 0 auto;width:42px;height:42px;border-radius:10px;border:0;background:var(--bitter);color:var(--white);font-size:20px;cursor:pointer}
.stat{font-size:13.5px;color:var(--ink-2);line-height:1.6}

/* ---- toast ---- */
.toast{
  position:fixed;z-index:2000;left:50%;transform:translateX(-50%);
  bottom:calc(var(--sab) + 86px);
  background:var(--ink);color:var(--white);font-size:14px;font-weight:500;
  padding:10px 18px;border-radius:999px;box-shadow:var(--shadow);
  opacity:0;pointer-events:none;transition:opacity .25s;
  max-width:86vw;text-align:center;
}
.toast.show{opacity:1}
input[type=file]{display:none}
:focus-visible{outline:2px solid var(--bitter);outline-offset:2px}
</style>
</head>
<body>

<div id="map" aria-label="Mappa dei locali"></div>

<div class="topbar">
  <div class="searchbox">
    <span class="brand">Milano</span>
    <input id="q" type="text" placeholder="Cerca, o incolla coordinate…" autocomplete="off" enterkeyhint="search">
    <button class="clear" id="qclear" aria-label="Pulisci ricerca">✕</button>
  </div>
  <div class="results" id="results"></div>
</div>

<div class="fabs">
  <button class="fab" id="btn-locate" aria-label="Vai alla mia posizione" title="La mia posizione">➤</button>
  <button class="fab" id="btn-list" aria-label="Elenco dei posti salvati" title="Elenco">☰</button>
  <button class="fab" id="btn-settings" aria-label="Impostazioni" title="Impostazioni">⚙︎</button>
</div>

<nav class="bottombar" id="chips" aria-label="Filtri"></nav>

<div class="backdrop" id="backdrop"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <header>
    <h2 id="sheet-title"></h2>
    <button class="x" id="sheet-close" aria-label="Chiudi">✕</button>
  </header>
  <div class="body" id="sheet-body"></div>
</section>

<div class="toast" id="toast" role="status"></div>
<input type="file" id="importfile" accept="application/json,.json">
<input type="file" id="takeoutfile" accept=".json,.geojson,.csv,.kml,.xml,application/json,text/csv,application/geo+json,application/vnd.google-earth.kml+xml,application/xml,text/xml">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" integrity="sha384-eXVCORTRlv4FUUgS/xmOyr66XBVraen8ATNLMESp92FKXLAMiKkerixTiBvXriZr" crossorigin="anonymous"></script>
<script>
"use strict";

const APP_VERSION = "4.4";

/* ============ stato e persistenza ============ */
const LS_KEY = "posti.data.v1";
const LS_GKEY = "posti.gkey.v1";

/* chiave Google: archivio separato, non entra nei backup JSON */
function gKey(){
  try{ return localStorage.getItem(LS_GKEY) || ""; }catch(e){ return ""; }
}
function setGKey(v){
  try{
    if(v) localStorage.setItem(LS_GKEY, v);
    else localStorage.removeItem(LS_GKEY);
  }catch(e){ toast("Impossibile salvare la chiave"); }
}
const DEFAULT_CATS = [
  {id:"rist",  name:"Ristorante",  emoji:"🍝", color:"#D8432C"},
  {id:"pizza", name:"Pizzeria",    emoji:"🍕", color:"#E08914"},
  {id:"caffe", name:"Caffè",       emoji:"☕", color:"#7A4A2B"},
  {id:"cockt", name:"Cocktail bar",emoji:"🍸", color:"#8246AF"},
  {id:"enot",  name:"Enoteca",     emoji:"🍷", color:"#7D2231"},
  {id:"gelat", name:"Gelateria",   emoji:"🍨", color:"#2E8BC0"},
  {id:"past",  name:"Pasticceria", emoji:"🍰", color:"#D6699A"},
  {id:"altro", name:"Altro",       emoji:"📍", color:"#5B6472"}
];

const STATUSES = [
  {id:"try",     name:"Da provare", icon:"⏳", color:"#B07A2A"},
  {id:"visited", name:"Visitato",   icon:"✓",  color:"#3E7C4F"},
  {id:"fav",     name:"Preferito",  icon:"★",  color:"#E0A21C"}
];
const stById = id => STATUSES.find(s=>s.id===id) || STATUSES[0];

function sstr(v, max){ return typeof v === "string" ? v.trim().slice(0, max) : ""; }
function safeColor(c){
  const t = String(c || "").trim();
  return /^#[0-9a-fA-F]{6}$/.test(t) || /^#[0-9a-fA-F]{3}$/.test(t) ? t : "#5B6472";
}
/* Normalizza qualunque stato (archivio locale o backup importato).
   Scarta il non riparabile, ripara il resto, non si fida di nulla. */
function sanitizeState(d){
  if(!d || typeof d !== "object") return { ok:false };
  if(!Array.isArray(d.places) && !Array.isArray(d.categories)) return { ok:false };
  const out = { places:[], categories:[], settings:{} };
  const catIds = new Set();
  (Array.isArray(d.categories) ? d.categories : []).forEach(c=>{
    if(!c || typeof c !== "object") return;
    let id = sstr(c.id, 24) || uid();
    while(catIds.has(id)) id = uid();
    catIds.add(id);
    out.categories.push({ id, name: sstr(c.name, 40) || "Categoria",
      emoji: sstr(c.emoji, 16) || "📍", color: safeColor(c.color) });
  });
  if(!out.categories.length) out.categories = DEFAULT_CATS.map(c=>({...c}));
  let dropped = 0;
  const pIds = new Set();
  (Array.isArray(d.places) ? d.places : []).forEach(p=>{
    if(!p || typeof p !== "object"){ dropped++; return; }
    const lat = +p.lat, lon = +p.lon;
    const name = sstr(p.name, 200);
    if(!name || !validCoords(lat, lon)){ dropped++; return; }
    let id = sstr(p.id, 32) || uid();
    while(pIds.has(id)) id = uid();
    pIds.add(id);
    out.places.push({
      id, name, lat, lon,
      cat: sstr(p.cat, 24) || out.categories[0].id,
      status: ["try","visited","fav"].includes(p.status) ? p.status : "try",
      tags: Array.isArray(p.tags)
        ? [...new Set(p.tags.filter(t=>typeof t==="string").map(t=>t.trim().slice(0,40)).filter(Boolean))].slice(0,30)
        : [],
      notes: sstr(p.notes, 5000),
      address: sstr(p.address, 300),
      created: Number.isFinite(+p.created) ? +p.created : Date.now()
    });
  });
  const srt = d.settings && typeof d.settings === "object" ? d.settings.sort : null;
  const lb = d.settings && Number.isFinite(+d.settings.lastBackup) ? +d.settings.lastBackup : null;
  out.settings = { sort: ["name","dist","recent"].includes(srt) ? srt : "name" };
  if(lb) out.settings.lastBackup = lb;
  return { ok:true, state: out, dropped };
}

let state = load();
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const sd = sanitizeState(JSON.parse(raw));
      if(sd.ok) return sd.state;
    }
  }catch(e){ console.warn("load:", e); }
  return { places:[], categories: DEFAULT_CATS.map(c=>({...c})), settings:{} };
}
function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }
  catch(e){ toast("Errore di salvataggio: spazio esaurito?"); }
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

/* ============ utilità ============ */
function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, m => (
    {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]
  ));
}
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._h);
  toast._h = setTimeout(()=>t.classList.remove("show"), 2300);
}
function debounce(fn, ms){
  let h; return (...a)=>{ clearTimeout(h); h=setTimeout(()=>fn(...a), ms); };
}
function allTags(){
  const s = new Set();
  state.places.forEach(p => (p.tags||[]).forEach(t => s.add(t)));
  return [...s].sort((a,b)=>a.localeCompare(b,"it"));
}
function parseTags(str){
  return [...new Set(String(str||"").split(",").map(t=>t.trim().replace(/^#/,"")).filter(Boolean))];
}
function fmtDist(m){
  if(!Number.isFinite(m)) return "";
  if(m < 1000) return Math.round(m) + " m";
  return (m/1000).toFixed(m < 10000 ? 1 : 0).replace(".", ",") + " km";
}

/* pressione prolungata sulla mappa → aggiungi posto */
(function longPress(){
  const el = map.getContainer();
  let timer = null, start = null;
  const cancel = ()=>{ clearTimeout(timer); timer = null; };
  el.addEventListener("touchstart", e=>{
    if(e.touches.length !== 1) return cancel();
    start = { x:e.touches[0].clientX, y:e.touches[0].clientY };
    timer = setTimeout(()=>{
      const pt = map.mouseEventToLatLng(e.touches[0]);
      onMapLongPress(pt);
    }, 550);
  }, {passive:true});
  el.addEventListener("touchmove", e=>{
    if(!timer || !start) return;
    const dx = e.touches[0].clientX - start.x, dy = e.touches[0].clientY - start.y;
    if(Math.hypot(dx,dy) > 12) cancel();
  }, {passive:true});
  el.addEventListener("touchend", cancel);
  el.addEventListener("touchcancel", cancel);
  map.on("contextmenu", e => onMapLongPress(e.latlng)); // desktop: tasto destro
})();

async function onMapLongPress(latlng){
  if(navigator.vibrate) navigator.vibrate(12);
  clearTmp();
  tmpMarker = L.marker(latlng, { icon: pinIcon({emoji:"➕", color:"#D8432C"}, true) }).addTo(map);
  map.panTo(latlng);
  const addr = await reverseGeocode(latlng.lat, latlng.lng);
  openForm({ lat: latlng.lat, lon: latlng.lng, address: addr, name: "" });
}

/* ============ geocoding ============ */
/* --- coordinate o link mappa incollati nella barra di ricerca --- */
function coordsFromText(t){
  const s = String(t||"").trim();
  const c = coordsFromUrl(s);            // link Google Maps con coordinate
  if(c && validCoords(c.lat, c.lon)) return c;
  // coppia di coordinate: "37.4438, 25.3245" (decimali obbligatori)
  const m = s.match(/^\(?\s*(-?\d{1,2}\.\d+)\s*[,;]?\s+?\s*(-?\d{1,3}\.\d+)\s*\)?$/)
         || s.match(/^\(?\s*(-?\d{1,2}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)\s*\)?$/);
  if(m){
    const lat = parseFloat(m[1]), lon = parseFloat(m[2]);
    if(validCoords(lat, lon)) return { lat, lon };
  }
  return null;
}
function isShortMapLink(t){
  return /(maps\.app\.goo\.gl|goo\.gl\/maps)/i.test(String(t||""));
}

/* --- Google Places (Text Search New): motore primario se la chiave è configurata --- */
async function searchGoogle(q){
  const key = gKey();
  if(!key) return null;
  const c = map.getCenter();
  const body = {
    textQuery: q,
    languageCode: "it",
    maxResultCount: 8,
    locationBias: { circle: { center: { latitude: c.lat, longitude: c.lng }, radius: 30000 } }
  };
  const r = await fetch("https://places.googleapis.com/v1/places:searchText", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "X-Goog-Api-Key": key,
      // field mask minimale: mantiene la chiamata nella fascia gratuita
      "X-Goog-FieldMask": "places.displayName,places.formattedAddress,places.location"
    },
    body: JSON.stringify(body)
  });
  if(!r.ok){
    let msg = "";
    try{ const e = await r.json(); msg = (e.error && e.error.message) || ""; }catch(_){}
    throw new Error(`HTTP ${r.status}${msg ? " – " + msg : ""}`);
  }
  const d = await r.json();
  return (d.places || []).map(p=>({
    name: (p.displayName && p.displayName.text) || "Senza nome",
    address: p.formattedAddress || "",
    lat: p.location && p.location.latitude,
    lon: p.location && p.location.longitude,
    src: "google"
  })).filter(x=>Number.isFinite(x.lat) && Number.isFinite(x.lon));
}

async function searchPlaces(q){
  // coordinate o link con coordinate: risposta immediata, nessun motore coinvolto
  const coord = coordsFromText(q);
  if(coord){
    const addr = await reverseGeocode(coord.lat, coord.lon);
    return [{
      name: addr ? addr.split(",")[0].trim() : "Posizione",
      address: addr || `${coord.lat}, ${coord.lon}`,
      lat: coord.lat, lon: coord.lon, src: "coord"
    }];
  }
  if(gKey()){
    try{
      const g = await searchGoogle(q);
      if(g && g.length) return g;
      if(g) return [];   // Google ha risposto ma non conosce il locale
    }catch(e){
      console.warn("google:", e);
      toast("Google non disponibile: uso OpenStreetMap");
    }
  }
  return searchOSM(q);
}

async function searchOSM(q){
  const c = map.getCenter();
  const seen = new Set();
  const out = [];
  const push = list => list.forEach(f=>{
    if(!Number.isFinite(f.lat) || !Number.isFinite(f.lon)) return;
    const k = f.name.toLowerCase() + "|" + f.lat.toFixed(4) + "|" + f.lon.toFixed(4);
    if(!seen.has(k)){ seen.add(k); out.push(f); }
  });
  const mapPhoton = f => {
    const p = f.properties || {};
    const parts = [p.street && (p.street + (p.housenumber? " "+p.housenumber : "")), p.postcode, p.city || p.county, p.country]
      .filter(Boolean);
    return {
      name: p.name || parts[0] || "Senza nome",
      address: parts.join(", "),
      lat: f.geometry.coordinates[1],
      lon: f.geometry.coordinates[0]
    };
  };
  const photon = async (bias) => {
    try{
      const u = `https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=6`
        + (bias ? `&lat=${c.lat.toFixed(4)}&lon=${c.lng.toFixed(4)}` : "");
      const r = await fetch(u);
      if(r.ok){ const d = await r.json(); return (d.features||[]).map(mapPhoton); }
    }catch(e){ console.warn("photon:", e); }
    return [];
  };
  // due ricerche in parallelo: vicino al centro mappa + globale senza bias
  const [near, glob] = await Promise.all([photon(true), photon(false)]);
  push(near); push(glob);
  // Nominatim entra in gioco ogni volta che i risultati sono scarsi
  if(out.length < 3){
    try{
      const u = `https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&accept-language=it&q=${encodeURIComponent(q)}`;
      const r = await fetch(u);
      if(r.ok){
        const d = await r.json();
        push(d.map(x=>({
          name: x.name || (x.display_name||"").split(",")[0],
          address: x.display_name || "",
          lat: parseFloat(x.lat), lon: parseFloat(x.lon)
        })));
      }
    }catch(e){ console.warn("nominatim:", e); }
  }
  return out.slice(0, 8);
}
async function reverseGeocode(lat, lon){
  try{
    const u = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&accept-language=it&lat=${lat}&lon=${lon}`;
    const r = await fetch(u);
    if(r.ok){ const d = await r.json(); return d.display_name || ""; }
  }catch(e){ console.warn("reverse:", e); }
  return "";
}

      b.type = "button";
      b.className = "chip" + (selCat===c.id ? " on" : "");

      b.innerHTML = `${esc(c.emoji)} ${esc(c.name)}`;

      catsEl.appendChild(b);
    });
  }
  paintCats();

  const stEl = body.querySelector("#f-status");
  function paintStatus(){
    stEl.innerHTML = "";
    STATUSES.forEach(s=>{
      const b = document.createElement("button");
      b.type = "button";
      b.className = "chip" + (selSt===s.id ? " on" : "");
      b.style.setProperty("--c", s.color);
      b.innerHTML = `${s.icon} ${esc(s.name)}`;
      b.addEventListener("click", ()=>{ selSt = s.id; paintStatus(); });
      stEl.appendChild(b);
    });
  }
  paintStatus();

  /* autocomplete tag */
  const tagsInp = body.querySelector("#f-tags");
  const suggEl = body.querySelector("#f-tagsugg");
  function paintSugg(){
    const all = allTags();
    const cur = parseTags(tagsInp.value);
    const frag = tagsInp.value.split(",").pop().trim().toLowerCase().replace(/^#/,"");
    let cand = all.filter(t => !cur.includes(t));
    if(frag) cand = cand.filter(t => t.toLowerCase().includes(frag) && t.toLowerCase() !== frag);
    cand = cand.slice(0, 8);
    suggEl.innerHTML = "";

      b.className = "tag sugg";
      b.textContent = "#" + t;

        tagsInp.value = parts.join(",").replace(/^\s+/, "") + ", ";
        paintSugg();
        tagsInp.focus();
      });
      suggEl.appendChild(b);
    });

    }else{
      state.places.push(rec);
      toast("Posto salvato");
    }
    clearTmp();
    refresh();
    openDetail(rec.id);
  });
}

/* ============ elenco ============ */
function openList(){
  const body = openSheet("I tuoi posti");
  body.innerHTML = `
    <div class="listsearch"><input type="text" id="l-q" placeholder="Filtra per nome, tag o indirizzo…" autocomplete="off"></div>
    <div class="sortrow"><span class="lbl">Ordina</span><span id="l-sort"></span></div>
    <div id="l-items"></div>
  `;
  const itemsEl = body.querySelector("#l-items");
  const inp = body.querySelector("#l-q");
  const sortEl = body.querySelector("#l-sort");
  const CHUNK = 80;
  let shown = CHUNK;

  const SORTS = [
    {id:"name", label:"Nome"},
    {id:"dist", label:"Distanza"},
    {id:"recent", label:"Recenti"}
  ];
  function curSort(){ return (state.settings && state.settings.sort) || "name"; }
  function setSort(id){
    state.settings = state.settings || {};
    state.settings.sort = id;
    save();
    if(id === "dist" && !lastPos){
      toast("Attivo la posizione…");
      locateMe(false);
    }
    shown = CHUNK;
    paintSort(); paint();
  }
  function paintSort(){
    sortEl.innerHTML = "";
    SORTS.forEach(s=>{
      const b = document.createElement("button");
      b.className = "chip" + (curSort()===s.id ? " on" : "");
      b.style.setProperty("--c", "var(--neutral)");
      b.textContent = s.label;
      b.addEventListener("click", ()=> setSort(s.id));
      sortEl.appendChild(b);
    });
  }

  function makeRow(p){
    const c = catById(p.cat);
    const st = stById(p.status || "try");
    const b = document.createElement("button");
    b.className = "placerow";
    b.style.setProperty("--c", c.color);
    const dist = lastPos ? ` <span class="pdist">· ${fmtDist(distM(lastPos.lat, lastPos.lng, p.lat, p.lon))}</span>` : "";
    b.innerHTML = `
      <span class="pdot">${esc(c.emoji)}</span>
      <span class="pt">
        <div class="pn"><span style="color:${esc(st.color)}">${st.icon}</span> ${esc(p.name)}${dist}</div>
        ${p.address?`<div class="pa">${esc(p.address)}</div>`:""}
        ${(p.tags&&p.tags.length)?`<div class="ptags">${p.tags.map(t=>"#"+esc(t)).join(" ")}</div>`:""}
      </span>`;
    b.addEventListener("click", ()=>{ openDetail(p.id); });
    return b;
  }

  function paint(){
    if(!itemsEl.isConnected) return;
    const q = inp.value.trim().toLowerCase();
    let list = visiblePlaces();
    if(q) list = list.filter(p =>
      p.name.toLowerCase().includes(q) ||
      (p.address||"").toLowerCase().includes(q) ||
      (p.tags||[]).some(t=>t.toLowerCase().includes(q))
    );
    const s = curSort();
    if(s === "dist" && lastPos){
      list = [...list].sort((a,b)=>
        distM(lastPos.lat, lastPos.lng, a.lat, a.lon) - distM(lastPos.lat, lastPos.lng, b.lat, b.lon));
    }else if(s === "recent"){
      list = [...list].sort((a,b)=>(b.created||0)-(a.created||0));
    }else{
      list = [...list].sort((a,b)=>a.name.localeCompare(b.name,"it"));
    }
    itemsEl.innerHTML = "";
    if(!list.length){
      itemsEl.innerHTML = `<div class="empty">${state.places.length ? "Nessun posto corrisponde ai filtri." : "Nessun posto salvato.<br>Cerca un locale o tieni premuto sulla mappa per aggiungerne uno."}</div>`;
      return;
    }
    const frag = document.createDocumentFragment();
    list.slice(0, shown).forEach(p=> frag.appendChild(makeRow(p)));
    itemsEl.appendChild(frag);
    if(list.length > shown){
      const more = document.createElement("button");
      more.className = "loadmore";
      more.textContent = `Mostra altri (${list.length - shown} rimanenti)`;
      more.addEventListener("click", ()=>{ shown += 200; paint(); });
      itemsEl.appendChild(more);
    }
  }
  inp.addEventListener("input", debounce(()=>{ shown = CHUNK; paint(); }, 150));
  map.once("locationfound", ()=>{ if(sheet.classList.contains("open")) paint(); });
  paintSort();
  paint();
}

async function exportJSON(){
  const testo = JSON.stringify(state, null, 2);
  const nome = `MilanoGourmet-backup-${new Date().toISOString().slice(0,10)}.json`;
  // Via preferita su iPhone: menu di condivisione con file -> "Salva su File" / iCloud Drive
  try{
    const file = new File([testo], nome, { type:"application/json" });
    if(navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title:"Backup MilanoGourmet" });
      markBackup();
      return;
    }
  }catch(e){
    if(e && e.name === "AbortError") return; // l'utente ha annullato il menu: nessun errore
    console.warn("share:", e);
  }
  // Ricaduta (browser desktop o iOS che non condivide file): download classico
  const blob = new Blob([testo], { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = nome;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  markBackup();
  toast("Backup esportato");
}
function markBackup(){
  state.settings = state.settings || {};
  state.settings.lastBackup = Date.now();
  save();
  const el = document.getElementById("s-bkstat");
  if(el) el.textContent = backupStatusText();
}
function backupStatusText(){
  const t = state.settings && state.settings.lastBackup;
  const n = state.places.length;
  if(!t) return `${n} posti salvati. Nessun backup ancora esportato.`;
  const giorni = Math.floor((Date.now() - t) / 86400000);
  const quando = giorni <= 0 ? "oggi" : giorni === 1 ? "ieri" : `${giorni} giorni fa`;
  return `${n} posti. Ultimo backup: ${quando}.`;
}
document.getElementById("importfile").addEventListener("change", e=>{
  const f = e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const sd = sanitizeState(JSON.parse(r.result));
      if(!sd.ok) throw new Error("formato");
      const extra = sd.dropped ? ` (${sd.dropped} voci scartate perché non valide)` : "";
      if(!confirm(`Importare ${sd.state.places.length} posti${extra}? I dati attuali verranno sostituiti.`)) return;
      state = sd.state;
      state.settings = state.settings || {};
      state.settings.lastBackup = Date.now();
      save();
      filters.cats.clear(); filters.tags.clear(); filters.status.clear();
      refresh(); closeSheet();
      toast("Backup ripristinato");
    }catch(err){ toast("File non valido"); }
  };
  r.readAsText(f);
  e.target.value = "";
});

/* ============ import Google Takeout / My Maps ============ */
function parseKML(text){
  const items = [], pending = [];
  let doc;
  try{ doc = new DOMParser().parseFromString(text, "application/xml"); }
  catch(e){ return {items, pending}; }
  const marks = doc.getElementsByTagName("Placemark");
  for(let k=0; k<marks.length; k++){
    const pm = marks[k];
    const nameEl = pm.getElementsByTagName("name")[0];
    const name = (nameEl ? nameEl.textContent : "").trim();
    if(!name) continue;
    const descEl = pm.getElementsByTagName("description")[0];
    let notes = (descEl ? descEl.textContent : "")
      .replace(/<[^>]+>/g, " ")
      .replace(/&amp;/gi, "&").replace(/&lt;/gi, "<").replace(/&gt;/gi, ">")
      .replace(/&quot;/gi, '"').replace(/&#0?39;/g, "'").replace(/&nbsp;/gi, " ")
      .replace(/&[a-z]+;/gi, " ")
      .replace(/\s+/g, " ").trim();
    if(notes.length > 280) notes = notes.slice(0, 280) + "…";
    const pt = pm.getElementsByTagName("Point")[0];
    if(pt){
      const cEl = pt.getElementsByTagName("coordinates")[0];
      const first = (cEl ? cEl.textContent : "").trim().split(/\s+/)[0] || "";
      const parts = first.split(",");
      const lon = parseFloat(parts[0]), lat = parseFloat(parts[1]);
      if(validCoords(lat, lon)){ items.push({name, address:"", lat, lon, notes}); continue; }
    }
    // percorsi/aree (LineString, Polygon, ...) non sono locali: ignora
    if(pm.getElementsByTagName("LineString").length || pm.getElementsByTagName("Polygon").length ||
       pm.getElementsByTagName("MultiGeometry").length) continue;
    pending.push({name, notes});
  }
  return {items, pending};
}
function parseCSV(text){
  const rows = []; let row = [], field = "", inQ = false;
  for(let i=0; i<text.length; i++){
    const ch = text[i];
    if(inQ){
      if(ch === '"'){ if(text[i+1] === '"'){ field += '"'; i++; } else inQ = false; }
      else field += ch;
    }else{
      if(ch === '"') inQ = true;
      else if(ch === ','){ row.push(field); field = ""; }
      else if(ch === '\n'){ row.push(field); rows.push(row); row = []; field = ""; }
      else if(ch !== '\r') field += ch;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.length > 1 || (r[0] && r[0].trim()));
}
function coordsFromUrl(u){
  if(!u) return null;
  let m = u.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
  if(m) return {lat:+m[1], lon:+m[2]};
  m = u.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/);
  if(m) return {lat:+m[1], lon:+m[2]};
  m = u.match(/[?&](?:q|ll)=(-?\d+\.\d+),(-?\d+\.\d+)/);
  if(m) return {lat:+m[1], lon:+m[2]};
  return null;
}
function validCoords(lat, lon){
  return Number.isFinite(lat) && Number.isFinite(lon) &&
    Math.abs(lat) <= 90 && Math.abs(lon) <= 180 && !(lat === 0 && lon === 0);
}
function parseTakeout(text){
  const items = [], pending = [];
  const t = text.trim();
  if(t.startsWith("<") || t.indexOf("<kml") !== -1 || t.indexOf("<Placemark") !== -1){
    return parseKML(text);
  }
  let gj = null;
  try{ gj = JSON.parse(text); }catch(e){}
  if(gj && gj.type === "FeatureCollection" && Array.isArray(gj.features)){
    gj.features.forEach(f=>{
      const pr = f.properties || {};
      const loc = pr.Location || {};
      const name = (pr.Title || loc["Business Name"] || pr.name || "").trim();
      if(!name) return;
      const notes = (pr.Note || pr.Comment || "").trim();
      let lat = null, lon = null;
      if(f.geometry && Array.isArray(f.geometry.coordinates)){
        lon = +f.geometry.coordinates[0]; lat = +f.geometry.coordinates[1];
      }
      if(!validCoords(lat, lon) && loc["Geo Coordinates"]){
        lat = +loc["Geo Coordinates"].Latitude; lon = +loc["Geo Coordinates"].Longitude;
      }
      if(validCoords(lat, lon)) items.push({name, address: loc.Address || "", lat, lon, notes});
      else pending.push({name, notes});
    });
    return {items, pending};
  }
  const rows = parseCSV(text);
  if(rows.length < 2) return {items, pending};
  const head = rows[0].map(h => h.trim().toLowerCase());
  const iT = head.indexOf("title"), iU = head.indexOf("url"),
        iN = head.indexOf("note"), iC = head.indexOf("comment");
  if(iT === -1) return {items, pending};
  rows.slice(1).forEach(r=>{
    const name = (r[iT] || "").trim();
    if(!name) return;
    const notes = [iN>-1 ? r[iN] : "", iC>-1 ? r[iC] : ""].map(x=>(x||"").trim()).filter(Boolean).join(" — ");
    const c = coordsFromUrl(iU>-1 ? r[iU] : "");
    if(c && validCoords(c.lat, c.lon)) items.push({name, address:"", lat:c.lat, lon:c.lon, notes});
    else pending.push({name, notes});
  });
  return {items, pending};
}
function distM(lat1, lon1, lat2, lon2){
  const R = 6371000, toR = Math.PI/180;
  const x = (lon2-lon1)*toR*Math.cos((lat1+lat2)/2*toR);
  const y = (lat2-lat1)*toR;
  return Math.sqrt(x*x + y*y) * R;
}
function isDup(name, lat, lon){
  const n = name.trim().toLowerCase();
  return state.places.some(p => p.name.trim().toLowerCase() === n && distM(p.lat, p.lon, lat, lon) < 150);
}
async function geocodeOne(name){
  try{
    const c = map.getCenter();
    const u = `https://photon.komoot.io/api/?q=${encodeURIComponent(name)}&limit=1&lat=${c.lat.toFixed(3)}&lon=${c.lng.toFixed(3)}`;
    const r = await fetch(u);
    if(r.ok){
      const d = await r.json();
      const f = (d.features || [])[0];
      if(f && f.geometry){
        const p = f.properties || {};
        const parts = [p.street && (p.street + (p.housenumber? " "+p.housenumber : "")), p.postcode, p.city || p.county].filter(Boolean);
        return { lat: f.geometry.coordinates[1], lon: f.geometry.coordinates[0], address: parts.join(", ") };
      }
    }
  }catch(e){ console.warn("geocodeOne:", e); }
  return null;
}
function openTakeoutPreview(parsed){
  const {items, pending} = parsed;
  const MAXG = 100;
  const toGeo = pending.slice(0, MAXG);
  let selCat = (state.categories.find(c=>c.id==="altro") || state.categories[0]).id;
  let selSt = "try";
  const body = openSheet("Importa da Google");
  body.innerHTML = `
    <p class="stat" style="margin-bottom:14px">
      Riconosciuti <b>${items.length}</b> posti con coordinate${pending.length ? ` e <b>${pending.length}</b> senza coordinate, che verranno cercati per nome${pending.length>MAXG ? ` (primi ${MAXG})` : ""}` : ""}.
    </p>
    <div class="field"><label>Categoria assegnata</label><div class="catpick" id="tk-cats"></div></div>
    <div class="field"><label>Stato assegnato</label><div class="catpick" id="tk-st"></div></div>
    <div class="btnrow">
      <button class="btn ghost" id="tk-cancel">Annulla</button>
      <button class="btn primary" id="tk-go">Avvia importazione</button>
    </div>
    <p class="stat" id="tk-prog" style="margin-top:12px"></p>
  `;
  const catsEl = body.querySelector("#tk-cats");
  function paintC(){
    catsEl.innerHTML = "";
    state.categories.forEach(c=>{
      const b = document.createElement("button");
      b.type = "button";
      b.className = "chip" + (selCat===c.id ? " on" : "");
      b.style.setProperty("--c", c.color);
      b.innerHTML = `${esc(c.emoji)} ${esc(c.name)}`;
      b.addEventListener("click", ()=>{ selCat = c.id; paintC(); });
      catsEl.appendChild(b);
    });
  }
  paintC();
  const stEl = body.querySelector("#tk-st");
  function paintS(){
    stEl.innerHTML = "";
    STATUSES.forEach(s=>{
      const b = document.createElement("button");
      b.type = "button";
      b.className = "chip" + (selSt===s.id ? " on" : "");
      b.style.setProperty("--c", s.color);
      b.innerHTML = `${s.icon} ${esc(s.name)}`;
      b.addEventListener("click", ()=>{ selSt = s.id; paintS(); });
      stEl.appendChild(b);
    });
  }
  paintS();
  body.querySelector("#tk-cancel").addEventListener("click", closeSheet);
  body.querySelector("#tk-go").addEventListener("click", async ()=>{
    const go = body.querySelector("#tk-go");
    const prog = body.querySelector("#tk-prog");
    go.disabled = true;
    let added = 0, dup = 0, fail = 0;
    const push = (it)=>{
      state.places.push({
        id: uid(), name: it.name, cat: selCat, status: selSt,
        tags: [], notes: it.notes || "", address: it.address || "",
        lat: it.lat, lon: it.lon, created: Date.now()
      });
      added++;
    };
    items.forEach(it=>{ isDup(it.name, it.lat, it.lon) ? dup++ : push(it); });
    save(); renderMarkers(); renderChips();
    for(let i=0; i<toGeo.length; i++){
      if(!body.isConnected) break;
      prog.textContent = `Ricerca coordinate ${i+1}/${toGeo.length}: ${toGeo[i].name}`;
      const g = await geocodeOne(toGeo[i].name);
      if(g){
        if(isDup(toGeo[i].name, g.lat, g.lon)) dup++;
        else push({...toGeo[i], ...g});
      }else fail++;
      await new Promise(r=>setTimeout(r, 300));
    }
    save(); refresh();
    const skipped = pending.length - toGeo.length;
    prog.textContent = `Importazione completata: ${added} aggiunti, ${dup} duplicati ignorati, ${fail} non trovati${skipped ? `, ${skipped} oltre il limite di ${MAXG}` : ""}.`;
    if(added && state.places.length){
      const b = L.latLngBounds(state.places.map(p=>[p.lat, p.lon]));
      map.fitBounds(b.pad(0.2), { maxZoom: 15 });
    }
    toast(`${added} posti importati`);
    go.style.display = "none";
    body.querySelector("#tk-cancel").textContent = "Chiudi";
  });
}
document.getElementById("takeoutfile").addEventListener("change", e=>{
  const f = e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    const parsed = parseTakeout(String(r.result || ""));
    if(!parsed.items.length && !parsed.pending.length){
      toast("Nessun posto riconosciuto nel file");
      return;
    }
    openTakeoutPreview(parsed);
  };
  r.readAsText(f);
  e.target.value = "";
});

/* ============ posizione ============ */
let meMarker = null;
let accCircle = null;
let lastPos = null;
let locating = false;
const btnLocate = document.getElementById("btn-locate");

function setLocBusy(on){
  locating = on;
  btnLocate.classList.toggle("busy", on);
  btnLocate.textContent = on ? "◌" : "➤";
}

function locateMe(center){
  if(locating) return;
  if(!navigator.geolocation){ toast("Questo browser non supporta la geolocalizzazione"); return; }
  if(!window.isSecureContext){ toast("La posizione richiede una connessione sicura (https)"); return; }
  setLocBusy(true);

  const onOk = pos => {
    setLocBusy(false);
    lastPos = L.latLng(pos.coords.latitude, pos.coords.longitude);
    if(meMarker) map.removeLayer(meMarker);
    if(accCircle) map.removeLayer(accCircle);
    meMarker = L.circleMarker(lastPos, { radius:8, color:"#FFFFFF", weight:3, fillColor:"#2E6FE8", fillOpacity:1 }).addTo(map);
    const acc = pos.coords.accuracy || 0;
    if(acc > 60){
      accCircle = L.circle(lastPos, { radius:acc, color:"#2E6FE8", weight:1, fillColor:"#2E6FE8", fillOpacity:.10 }).addTo(map);
    }
    if(center) map.setView(lastPos, Math.max(map.getZoom(), 16));
    map.fire("locationfound", { latlng: lastPos, accuracy: acc });
  };

  const onErr = (err, secondo) => {
    // timeout o posizione non disponibile: riprova senza alta precisione (rete invece di GPS)
    if((err.code === 3 || err.code === 2) && !secondo){
      navigator.geolocation.getCurrentPosition(onOk, e => onErr(e, true),
        { enableHighAccuracy:false, timeout:20000, maximumAge:300000 });
      return;
    }
    setLocBusy(false);
    let msg;
    if(err.code === 1){
      msg = "Permesso negato. Impostazioni iPhone → Privacy e sicurezza → Localizzazione → Safari (o MilanoGourmet) → Durante l'uso";
    }else if(err.code === 2){
      msg = "Posizione non rilevabile: prova all'aperto o verifica che la Localizzazione sia attiva";
    }else if(err.code === 3){
      msg = "Tempo scaduto: segnale troppo debole, riprova";
    }else{
      msg = "Posizione non disponibile";
    }
    toast(msg);
  };

  navigator.geolocation.getCurrentPosition(onOk, e => onErr(e, false),
    { enableHighAccuracy:true, timeout:12000, maximumAge:60000 });
}

btnLocate.addEventListener("click", ()=> locateMe(true));

/* ============ pulsanti ============ */
document.getElementById("btn-list").addEventListener("click", openList);
document.getElementById("btn-settings").addEventListener("click", openSettings);

/* ============ avvio ============ */
renderChips();
renderMarkers();
if(state.places.length){
  const b = L.latLngBounds(state.places.map(p=>[p.lat,p.lon]));
  map.fitBounds(b.pad(0.2), { maxZoom: 15 });
}

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=> navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
